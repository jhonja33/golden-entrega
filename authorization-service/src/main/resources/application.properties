spring.application.name=authorization-service
server.port=9090

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fincard_authorization?connectionTimeZone=UTC
spring.datasource.username=root
spring.datasource.password=admin

# Persistencia
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Usuario local para obtener tokens
app.security.username=root
app.security.password=admin

# Clave de firma JWT codificada en Base64
app.security.jwt-secret=Ger4tjEpK0WGOFqWDVqjdXZV+MiOOjHnmEqFsFQtyXU=

# Redis en Docker
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

# Usamos Redis como cache, sin repositorios Redis
spring.data.redis.repositories.enabled=false

# Duracion de la cache de saldos
app.cache.balance-ttl-seconds=15

# Logs del proyecto
logging.level.com.fincard.authorization=DEBUG


# Kafka: Spring Boot ejecutado desde Eclipse
spring.kafka.bootstrap-servers=localhost:9092

# Clave y contenido del mensaje como texto
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Confirmacion de recepcion y reintentos internos
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true

# Limites de espera del productor
spring.kafka.producer.properties[max.block.ms]=3000
spring.kafka.producer.properties[request.timeout.ms]=3000
spring.kafka.producer.properties[delivery.timeout.ms]=10000

# Topic exigido por la prueba
app.kafka.transaction-topic=transaction-events

# Documentacion OpenAPI y Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Orden visual de operaciones
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# No conservar credenciales al recargar la interfaz
springdoc.swagger-ui.persistAuthorization=false
