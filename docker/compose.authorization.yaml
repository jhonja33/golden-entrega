name: fincard

services:
  authorization-service:
    build:
      context: ../authorization-service

    ports:
      - "127.0.0.1:9090:9090"

    environment:
      SERVER_PORT: "9090"

      SPRING_DATASOURCE_URL: "${FINCARD_DB_URL:-jdbc:mysql://host.docker.internal:3306/fincard_authorization?connectionTimeZone=UTC}"
      SPRING_DATASOURCE_USERNAME: "${FINCARD_DB_USERNAME:-root}"
      SPRING_DATASOURCE_PASSWORD: "${FINCARD_DB_PASSWORD:-admin}"

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092