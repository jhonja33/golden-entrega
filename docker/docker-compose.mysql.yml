name: fincard

services:
  mysql:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: fincard_authorization

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >
          mysql --protocol=TCP
          -h 127.0.0.1
          -uroot
          -p"$${MYSQL_ROOT_PASSWORD}"
          -D fincard_authorization
          -e "SELECT 1 FROM cards LIMIT 1"
          > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  mysql-data: