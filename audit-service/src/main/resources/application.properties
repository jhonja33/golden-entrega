spring.application.name=audit-service
spring.main.web-application-type=none

# Conexion a Kafka desde Eclipse
spring.kafka.bootstrap-servers=localhost:9092

# Grupo fijo del consumidor
spring.kafka.consumer.group-id=fincard-audit-group
spring.kafka.consumer.auto-offset-reset=earliest

# Recibir clave y mensaje como texto
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Confirmar el procesamiento de cada mensaje mediante Spring
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Una instancia de consumidor para este prototipo
spring.kafka.listener.concurrency=1

# Topic de pagos aprobados
app.kafka.transaction-topic=transaction-events

# Archivo de auditoria
app.audit.file=./data/transactions-audit.log


